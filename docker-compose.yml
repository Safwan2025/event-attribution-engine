services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    volumes: [event-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  event-data:
